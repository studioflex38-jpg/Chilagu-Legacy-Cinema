name: Build Chilagu APK - YA UHAKIKA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip "zip Chilagu Cinema.zip" -d .
          rm "zip Chilagu Cinema.zip"

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Fix Kotlin & Gradle ZOTE
        run: |
          flutter create .
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.8.22'/g" android/build.gradle
          sed -i "s/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:8.1.0'/g" android/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chilagu-Cinema-APK-YA-UHAKIKA
          path: build/app/outputs/flutter-apk/app-debug.apk
