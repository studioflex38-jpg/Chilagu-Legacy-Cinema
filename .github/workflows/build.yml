name: Build Chilagu APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip "zip Chilagu Cinema.zip" -d .
          rm "zip Chilagu Cinema.zip"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Fix Gradle Project
        run: |
          flutter create --platforms=android .
          flutter pub get

      - name: Build APK
        run: flutter build apk --debug --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chilagu-Cinema-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
